name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ключ подписи
        run: base64 -d signing/debug.keystore.b64 > signing/debug.keystore

      - name: Сборка
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Переименовать
        run: cp app/build/outputs/apk/debug/app-debug.apk serbridge.apk

      - name: Сохранить как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: serbridge-apk
          path: serbridge.apk

      - name: Выложить в релиз «latest» (прямая ссылка для телефона)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest serbridge.apk --title "Последняя сборка" --notes "Сборка из ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M') UTC"
